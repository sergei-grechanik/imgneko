# SPDX-License-Identifier: MIT-0

name: Makefile Tests

# This workflow runs tests for the Makefile and the configure script.

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  makefile-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config zlib1g-dev

      - name: Run makefile test suite
        run: /bin/sh testing/scripts/test-makefile.sh
