name: Make Test

# This workflow runs all tests with the default and ASan configurations.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  clang-format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check C formatting
        run: |
          git ls-files '*.c' '*.h' | xargs clang-format -i
          git diff --exit-code

  make-test-default:
    runs-on: ubuntu-latest
    needs: clang-format-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure default build
        run: ./configure

      - name: Run default-profile tests
        run: make test

  make-test-asan:
    runs-on: ubuntu-latest
    needs: make-test-default

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Configure ASan build
        run: ./configure --profile=asan --cc=clang

      - name: Run ASan-profile tests
        run: make -C build/asan test
