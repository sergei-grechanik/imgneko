# SPDX-License-Identifier: MIT-0

name: Make Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  # Make sure there are no unaddressed review comments left in the codebase.
  review-marker-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check review placeholders
        run: /bin/sh testing/scripts/check-review-markers.sh

  # Check formatting with clang-format.
  clang-format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check C formatting
        run: |
          git ls-files '*.c' '*.h' | xargs clang-format -i
          git diff --exit-code

  # Check that the generated files committed to the repository are up to date.
  generated-file-check:
    runs-on: ubuntu-latest
    needs:
      - clang-format-check
      - review-marker-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Configure depfile regeneration build
        run: ./configure --build-dir=build/depfiles --depfiles

      - name: Regenerate checked-in dependency file
        run: |
          make BUILD_DIR=build/depfiles depfile
          git diff --exit-code -- mk/dependencies.mk

      - name: Regenerate checked-in row/column helper
        run: |
          python3 tools/generate-rowcolumn-helpers.py
          git diff --exit-code -- src/imgneko/rowcolumn_diacritics.c

  # Run `make test` and `make test-extra` with the default configuration.
  make-test-default:
    runs-on: ubuntu-latest
    needs: generated-file-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Configure default build
        run: ./configure

      - name: Run default-profile tests
        run: make -j4 test 2>&1

      - name: Run extra-profile tests
        run: make -j4 test-extra 2>&1

  # Run the small benchmark with the release configuration.
  benchmark-small:
    runs-on: ubuntu-latest
    needs: generated-file-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config qpdf zlib1g-dev

      - name: Configure release build
        run: ./configure --profile=release

      - name: Run small benchmark suite
        run: make -C build/release benchmark-small 2>&1

  # Run `make coverage` with the dev configuration and make sure the uncovered
  # quickfix report is empty.
  make-test-dev:
    runs-on: ubuntu-latest
    needs: make-test-default

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config zlib1g-dev

      - name: Configure dev build
        run: ./configure --profile=dev

      - name: Run dev-profile coverage
        # Note: This will run all tests and also generate a coverage report.
        run: make -j4 BUILD_DIR=build/dev coverage 2>&1

      - name: Require empty uncovered quickfix report
        run: |
          if [ -s build/dev/coverage/uncovered.qf ]; then
            cat build/dev/coverage/uncovered.qf
            echo "error: build/dev/coverage/uncovered.qf is not empty" >&2
            exit 1
          fi

      - name: Run tests again, just in case
        run: make -j4 BUILD_DIR=build/dev test 2>&1

  # Run `make test` with the dev configuration on macOS.
  make-test-macos:
    runs-on: macos-14
    needs: make-test-default

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install make llvm pkgconf zlib
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Configure dev build
        run: ./configure --profile=dev

      - name: Run dev-profile tests
        env:
          MallocNanoZone: "0"
        run: gmake BUILD_DIR=build/dev test 2>&1

  # Run `make test` with the default configuration in a minimal environment with
  # no python.
  make-test-default-minimal:
    runs-on: ubuntu-latest
    # Pin the image as well as APT so newer preinstalled packages cannot outgrow
    # the development packages available in the snapshot below.
    container: debian:bullseye-20260824-slim
    needs: generated-file-check
    defaults:
      run:
        shell: sh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Freeze package indexes and downloads together to avoid live-mirror 404s.
      # Snapshot metadata expires by design; package signatures remain checked.
      - name: Use Debian package snapshot
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260825T000000Z/ bullseye main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260825T000000Z/ bullseye-updates main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260825T000000Z/ bullseye-security main' \
            > /etc/apt/sources.list

      - name: Install minimal build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc libc6-dev make passwd util-linux zlib1g-dev

      # Root bypasses the directory permissions exercised by the default tests.
      # passwd provides useradd; util-linux provides runuser.
      - name: Create unprivileged test user
        run: useradd --create-home --user-group imgneko-test

      - name: Give the test user ownership of the build directory
        run: |
          mkdir -p build/default
          chown imgneko-test:imgneko-test build/default

      # Check after installation so transitive dependencies cannot silently
      # introduce a Python interpreter into the test system.
      - name: Require Python to be absent
        run: |
          for interpreter in python python2 python3 pypy pypy3; do
            if command -v "$interpreter"; then
              printf "error: unexpected Python interpreter: %s\n" "$interpreter" >&2
              exit 1
            fi
          done
          printf "%s\n" "Confirmed that no Python interpreter is on PATH."

      - name: Configure default build as the test user
        run: |
          runuser --user imgneko-test -- \
            ./configure --profile=default

      - name: Run default-profile tests as the test user
        run: |
          runuser --user imgneko-test -- \
            make -C build/default test 2>&1
